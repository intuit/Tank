<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:ts="http://xmlns.jcp.org/jsf/composite/tag"
  template="/WEB-INF/templates/tank.xhtml">

  <ui:define name="content">
    <h:form id="mainForm">
      <ts:toolbar title="Help" toolbarId="mainTB" id="mainTB" />

      <p:growl globalOnly="true" id="messages" autoUpdate="true" />

      <div class="vertical-spacer" />
      
      <h3>Intuit Tank build ${buildVersion.version}</h3> 
      <div class="vertical-spacer" />
      <p:fieldset legend="Tank Docs">
        <div>
          <h:outputLink value="https://intuit.github.io/Tank/" target="_blank">Tank Docs</h:outputLink>
          <div class="vertical-spacer" />
          <h:outputLink value="https://intuit.github.io/Tank/key-concepts/web-ui/" target="_blank">User Guide</h:outputLink>
          <div class="vertical-spacer" />
          <h:outputLink value="https://intuit.github.io/Tank/installation-guide/installation/" target="_blank">Installation Guide</h:outputLink>
        </div>
      </p:fieldset>

      <div class="vertical-spacer" />

      <p:fieldset legend="Tank V2 API Documentation">
        <div>
          <h:outputLink value="#{request.contextPath}/swagger-ui.html" target="tr_docs">Rest V2 API documentation</h:outputLink>
          
        </div>
      </p:fieldset>

    </h:form>

  </ui:define>
</ui:composition>
