AWSTemplateFormatVersion: 2010-09-09
Description: Create Controller and Agent IAM Instance Profiles for Intuit/Tank installation
Resources:
  ControllerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref ControllerRole
  ControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service:
                - ec2.amazonaws.com
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        -
          PolicyName: tank-controller-role
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:ListInstanceProfiles
                  - iam:AddRoleToInstanceProfile
                  - appconfig:GetConfiguration
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"
              -
                # the agent AMI (ssm-ami in settings.xml) and an OIDC client secret stored as a parameter;
                # a SecureString encrypted with a customer managed key also needs kms:Decrypt on that key
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/*'
                  # public parameters such as /aws/service/ami-amazon-linux-latest/...
                  - !Sub 'arn:${AWS::Partition}:ssm:*::parameter/aws/service/*'
  AgentProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref AgentRole
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        -
          PolicyName: tank-agent-role
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              -
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:PutMetricStream
                Resource: "*"

Outputs:
  TankControllerProfile:
    Description: Tank Controller Profile
    Value:  !Ref ControllerProfile
    Export:
      Name:  TankControllerProfile
  TankControllerRole:
    Description: Tank Controller Role
    Value:  !Ref ControllerRole
    Export:
      Name:  TankControllerRole
  TankAgentProfile:
    Description: Tank Agent Profile
    Value:  !Ref AgentProfile
    Export:
      Name:  TankAgentProfile
  TankAgentRole:
    Description: Tank Agent Role
    Value:  !Ref AgentRole
    Export:
      Name:  TankAgentRole
