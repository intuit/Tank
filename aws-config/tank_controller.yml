AWSTemplateFormatVersion: 2010-09-09
Description: Controller Instance - Creates a Tank controller installing java tomcat and configuring the instances appropriately.
Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: SSM parameter for the latest Amazon Linux 2023 arm64 baseline AMI (Graviton instance types only)
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access to the instance.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the controller and its database; SubnetId and DBSubnetIds must belong to it
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for the internal instance ip
  DBSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the RDS database, in at least two Availability Zones
  TankWar:
    Type: String
    Description: File path to Tank tank.war Filename in S3 (ie. s3://bucket/keyname)
  TankSettings:
    Type: String
    Description: File path to Tank settings.xml Filename in S3 (ie. s3://bucket/keyname)
  RdsPassword:
    Type: String
    NoEcho: true
    Description: Something secret (more than 8 characters)
  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: 't4g.large'
    AllowedValues: [ 't4g.medium', 't4g.large', 't4g.xlarge', 'm7g.large', 'm7g.xlarge', 'c7g.xlarge', 'c7g.2xlarge' ]
    ConstraintDescription: 'Must be a Graviton (arm64) type: t4g.medium t4g.large t4g.xlarge m7g.large m7g.xlarge c7g.xlarge or c7g.2xlarge'

Resources:
  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: tank
      AutoMinorVersionUpgrade: true
      DBInstanceClass: db.t4g.large
      Port: 3306
      AllocatedStorage: 100
      BackupRetentionPeriod: 30
      DBName: tank
      Engine: mysql
      EngineVersion: '8.4.11'
      MasterUsername: admin
      MasterUserPassword: !Ref RdsPassword
      DBSubnetGroupName: !Ref RDSSubnetGroup
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the Tank database
      SubnetIds: !Ref DBSubnetIds

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL from the Tank controller
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt SecurityGroup.GroupId

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ssh and http tomcat to client host
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  ControllerInstance:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default: ['metric-config', 'tomcat-config' ]
        metric-config:
          packages:
            yum:
              amazon-cloudwatch-agent: []
          groups: {}
          users: {}
          sources: {}
          files:
            /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d/tank-cloudwatch-config.json:
              content: |
                {"logs":{"force_flush_interval":5,"logs_collected":{
                  "files":{"collect_list":[
                    {"file_path":"/var/log/tomcat/catalina*.log","log_group_name":"/var/log/tomcat/catalina.log","log_stream_name":"{instance_id}"},
                    {"file_path":"/var/log/tomcat/tank.log","log_group_name":"/var/log/tomcat/tank.log","log_stream_name":"{instance_id}"},
                    {"file_path":"/var/log/tomcat/gc.log","log_group_name":"/var/log/tomcat/gc.log","log_stream_name":"{instance_id}"},
                    {"file_path":"/var/log/messages","log_group_name":"/var/log/messages","log_stream_name":"{instance_id}"}]}}},
                  "metrics":{"append_dimensions":{"InstanceId":"${aws:InstanceId}","InstanceType":"${aws:InstanceType}"},"metrics_collected":{
                    "disk":{"measurement":["used_percent"],"resources":["/"],"append_dimensions":{"Service":"Tank"},"metrics_collection_interval":60},
                    "mem":{"measurement":["mem_used_percent"],"append_dimensions":{"Service":"Tank"},"metrics_collection_interval":60}}},
                  "traces":{"traces_collected":{"otlp":{},"xray":{}}}}
              mode: '000644'
              owner: 'cwagent'
              group: 'cwagent'
          commands: {}
          services:
            systemd:
              amazon-cloudwatch-agent:
                enabled      : true
                ensureRunning: true
                files:
                  - "/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d/tank-cloudwatch-config.json"
        tomcat-config:
          packages:
            yum:
              tomcat-native: []
              java-25-amazon-corretto-headless: []
          users:
            tomcat: {}
          groups: {}
          sources:
            /opt: https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.27/bin/apache-tomcat-11.0.27.tar.gz
          files:
            /etc/systemd/system/tomcat.service:
              content: |
                [Unit]
                Description=Apache Tomcat (Tank controller)
                After=network-online.target
                Wants=network-online.target

                [Service]
                Type=simple
                EnvironmentFile=/etc/sysconfig/tomcat
                Environment=CATALINA_HOME=/opt/tomcat
                WorkingDirectory=/opt/tomcat
                ExecStart=/opt/tomcat/bin/catalina.sh run
                # the JVM exits 143 on SIGTERM after a clean shutdown
                SuccessExitStatus=143
                LimitNOFILE=50000
                UMask=0077

                [Install]
                WantedBy=multi-user.target
              mode: '000644'
              owner: 'root'
              group: 'root'
            /etc/sysconfig/tomcat:
              content: |
                CATALINA_OPTS="-XX:InitialRAMPercentage=70.0 -XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -Xlog:gc=debug:file=/var/log/tomcat/gc.log:time,uptime,level,tags:filecount=3,filesize=200m -javaagent:/opt/aws-otel/aws-opentelemetry-agent.jar"
                OTEL_SERVICE_NAME=Tank
                OTEL_TRACES_SAMPLER=xray
                OTEL_METRICS_EXPORTER=none
                OTEL_LOGS_EXPORTER=none
              mode: '000644'
              owner: 'root'
              group: 'root'
            /opt/aws-otel/aws-opentelemetry-agent.jar:
              source: https://github.com/aws-observability/aws-otel-java-instrumentation/releases/download/v2.31.0/aws-opentelemetry-agent.jar
              mode: '000644'
              owner: 'tomcat'
              group: 'tomcat'
            /tmp/context.xml:
              content: !Sub |
                <?xml version="1.0" encoding="UTF-8"?>

                <Context>
                    <Resource name="jdbc/watsDS" auth="Container"
                    type="javax.sql.DataSource"
                    factory="org.apache.tomcat.jdbc.pool.DataSourceFactory"
                    maxWait="10000"
                    username="admin"  password="${RdsPassword}"
                    testOnBorrow="true"
                    validationQuery="SELECT 1"
                    removeAbandonedOnBorrow="true"
                    removeAbandonedOnMaintenance="true"
                    removeAbandonedTimeout="60"
                    driverClassName="com.mysql.cj.jdbc.Driver"
                    url="jdbc:mysql://${RDSInstance.Endpoint.Address}:${RDSInstance.Endpoint.Port}/tank"/>
                </Context>
              mode: '000644'
              owner: 'tomcat'
              group: 'tomcat'
          commands:
            010_tomcat_symboliclink:
              command: 'ln -s /opt/apache-tomcat-11.0.27 /opt/tomcat'
            011_tomcat_symboliclink:
              command: 'ln -s /opt/tomcat/logs /var/log/tomcat'
            020_clear_out_builtin:
              command: 'rm -rf /opt/tomcat/webapps/*'
            030_download_settings:
              command: !Sub 'aws s3 cp ${TankSettings} /usr/share/tomcat/settings.xml'
            031_permissions:
              command:  'chown tomcat:tomcat /usr/share/tomcat/settings.xml'
            050_copy_context:
              command: 'cp /tmp/context.xml /opt/tomcat/conf/context.xml'
            #031_set_publicDNSName:
            #  command: !Sub 'sed -i "s/localhost:8080/${ControllerInstance.PublicDnsName}:8080/" /usr/share/tomcat/settings.xml'
            060_download_tank:
              command: !Sub 'aws s3 cp ${TankWar} /usr/share/tomcat/webapps/ROOT.war'
            070_permissions:
              command: 'chown -R tomcat:tomcat /opt/apache-tomcat-11.0.27'
            080_systemd_reload:
              command: 'systemctl daemon-reload'
          services:
            systemd:
              tomcat:
                enabled      : true
                ensureRunning: true
    Properties:
      ImageId:  !Ref AmiId
      InstanceType:  !Ref InstanceType
      IamInstanceProfile: !ImportValue TankControllerProfile
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      Tags:
        -
          Key: Name
          Value: Tank
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -v
          # Ensure our PATH is set correctly (on Amazon Linux cfn-signal is in /opt/aws/bin)
          . ~/.bash_profile
          dnf upgrade -y
          dnf install -y aws-cfn-bootstrap
          /opt/aws/bin/cfn-init -v \
            --region  ${AWS::Region} \
            --stack   ${AWS::StackName} \
            --resource ControllerInstance
          /opt/aws/bin/cfn-signal -e $? \
            --region  ${AWS::Region} \
            --stack   ${AWS::StackName} \
            '${UIInstanceWaitHandle}'
  UIInstanceWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
    Properties: {}
  UIInstanceWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: ControllerInstance
    Properties:
      Handle:  !Ref UIInstanceWaitHandle
      Timeout: 1800

Outputs:
  InstanceId:
    Description: InstanceId of the newly created controller instance
    Value:  !Ref ControllerInstance
  PublicDnsName:
    Description: PublicDnsName endpoint of the newly created ControllerInstance
    Value:  !GetAtt [ 'ControllerInstance', 'PublicDnsName' ]
